            "17.0.0.1020|17.0.0|Firmware 17.0.0|2023-10-11"
            "17.0.0.5020|17.0.0-rebootless1|Firmware 17.0.0 [Rebootless Update 1]|2023-11-21"
            "17.0.1.0060|17.0.1|Firmware 17.0.1|2023-12-05"
            "17.0.1.5020|17.0.1-rebootless1|Firmware 17.0.1 [Rebootless Update 1]|2024-02-20"
            "18.0.0.1140|18.0.0|Firmware 18.0.0|2024-03-26"
            "18.0.1.0100|18.0.1|Firmware 18.0.1|2024-04-23"
            "18.1.0.0160|18.1.0|Firmware 18.1.0|2024-06-11"
            "18.1.0.5020|18.1.0-rebootless1|Firmware 18.1.0 [Rebootless Update 1]|2024-07-02"
            "19.0.0.1080|19.0.0|Firmware 19.0.0|2024-10-08"
            "19.0.1.0100|19.0.1|Firmware 19.0.1|2024-10-29"
            "19.0.1.5020|19.0.1-rebootless1|Firmware 19.0.1 [Rebootless Update 1]|2025-01-07"
            "19.0.2.0020|19.0.2|Firmware 19.0.2|2026-01-20"
            "20.0.0.1720|20.0.0|Firmware 20.0.0|2025-04-30"
            "20.0.1.0020|20.0.1|Firmware 20.0.1|2025-05-02"
            "20.1.0.0360|20.1.0|Firmware 20.1.0|2025-05-28"
            "20.1.1.0020|20.1.1|Firmware 20.1.1|2025-06-03"
            "20.1.5.0160|20.1.5|Firmware 20.1.5|2025-06-19"
            "20.2.0.0300|20.2.0|Firmware 20.2.0|2025-07-15"
            "20.3.0.0080|20.3.0|Firmware 20.3.0|2025-07-29"
            "20.4.0.0200|20.4.0|Firmware 20.4.0|2025-09-02"
            "20.5.0.0100|20.5.0|Firmware 20.5.0|2025-09-30"
            "21.0.0.0940|21.0.0|Firmware 21.0.0|2025-11-11"
            "21.0.1.0040|21.0.1|Firmware 21.0.1|2025-11-25"
            "21.1.0.0280|21.1.0|Firmware 21.1.0|2025-12-09"
            "21.2.0.0140|21.2.0|Firmware 21.2.0|2026-01-13"
            "22.0.0.1100|22.0.0|Firmware 22.0.0|2026-03-17"
            "22.1.0.0200|22.1.0|Firmware 22.1.0|2026-04-07"
            "22.5.0.0480|22.5.0|Firmware 22.5.0|2026-06-16"
            "23.0.0.1200|23.0.0|Firmware 23.0.0|2026-09-10"
          )

          echo "========================================"
          echo "🔍 INSPECTING RELEASE: $TAG"
          echo "========================================"

          RAW=""
          CUSTOM_TITLE=""
          FW_DATE_REF=""
          for item in "${VERSIONS[@]}"; do
            IFS='|' read -r v_raw v_tag v_title v_date <<< "$item"
            if [ "$v_tag" = "$TAG" ]; then
              RAW="$v_raw"
              CUSTOM_TITLE="$v_title"
              FW_DATE_REF="$v_date"
              break
            fi
          done

          if [ -z "$RAW" ]; then
            RAW=$(echo "$TAG" | sed 's/-card//')
          fi

          PYTHON_ARG=$(echo "$RAW" | sed 's/-card//')
          if [[ "$PYTHON_ARG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PYTHON_ARG="${PYTHON_ARG}.0000"
          fi

          # Calcul mathématique exact du RAW version
          IFS='.' read -r M_MAJ M_MIN M_MIC M_BLD <<< "$PYTHON_ARG"
          M_BLD=$((10#$M_BLD))
          REAL_RAW_VAL=$(( (M_MAJ << 26) | (M_MIN << 20) | (M_MIC << 16) | M_BLD ))

          if [ -n "$CUSTOM_TITLE" ]; then
            FINAL_RELEASE_TITLE="$CUSTOM_TITLE (v$REAL_RAW_VAL)"
          else
            FINAL_RELEASE_TITLE="Firmware $TAG (v$REAL_RAW_VAL)"
          fi

          FOLDER_NAME="Firmware ${PYTHON_ARG}"

          rm -f *.zip *.nsp
          echo "⬇️ Downloading firmware archive from release $TAG..."
          gh release download "$TAG" -p "Firmware*.zip" --clobber || true

          FW_ZIP=$(ls Firmware*.zip 2>/dev/null | grep -v -i "^Extracted" | head -n 1)

          # Si aucun zip n'est attaché à la release (ex: 1.0.0-pre, cartouches sans dump), corriger le titre et quitter proprement
          if [ -z "$FW_ZIP" ] || [ ! -f "$FW_ZIP" ]; then
            echo "⚠️ Release $TAG does not contain any valid Firmware ZIP."
            echo "📝 Updating release title on GitHub anyway: $FINAL_RELEASE_TITLE"
            gh release edit "$TAG" --title "$FINAL_RELEASE_TITLE" || true
            exit 0
          fi

          echo "📦 Extracting $FW_ZIP strictly into $FOLDER_NAME..."
          mkdir -p temp_extract
          unzip -q "$FW_ZIP" -d temp_extract
          mkdir -p "$FOLDER_NAME"
          find temp_extract -type f -name "*.nca" -exec mv {} "$FOLDER_NAME"/ \; 2>/dev/null || true
          rm -rf temp_extract

          if [ "$BUILD_NSP" = "true" ]; then
            export FORCE_BUILD_NSP="true"
          else
            export FORCE_BUILD_NSP="false"
          fi

          echo "⚙️ Running firmware_downloader.py in pure LOCAL mode..."
          python3 firmware_downloader.py "$PYTHON_ARG" --local --logs 2>&1 | tee script_output.log || true

          # Récupération du Raw si affiché dans les logs
          VER_RAW_FROM_LOG=$(grep "Firmware Version Raw:" script_output.log 2>/dev/null | tail -n 1 | awk '{print $NF}')
          if [ -n "$VER_RAW_FROM_LOG" ] && [ "$VER_RAW_FROM_LOG" -gt 0 ] 2>/dev/null; then
            REAL_RAW_VAL="$VER_RAW_FROM_LOG"
            if [ -n "$CUSTOM_TITLE" ]; then
              FINAL_RELEASE_TITLE="$CUSTOM_TITLE (v$REAL_RAW_VAL)"
            else
              FINAL_RELEASE_TITLE="Firmware $TAG (v$REAL_RAW_VAL)"
            fi
          fi

          echo "📝 Mise à jour du titre de la release sur GitHub : $FINAL_RELEASE_TITLE"

          # Préparation des notes de version avec signature SDK
          sed -n '/Archive created:/,$p' script_output.log > changelog_body.txt
          CORRECT_ZIP_NAME="Firmware.${TAG}.zip"
          CORRECT_NSP_NAME="Firmware.${TAG}.nsp"
          sed -i -E "s/Archive created: .*/Archive created: ${CORRECT_ZIP_NAME}/g" changelog_body.txt
          sed -i -E "s/NSP created: .*/NSP created: ${CORRECT_NSP_NAME}/g" changelog_body.txt
          sed -i '/Not Found/d' changelog_body.txt
          sed -i '/Firmware Version Raw:/d' changelog_body.txt

          # Remplacement du hash LOCAL factice par le SHA256 réel du fichier ZIP téléchargé
          if grep -q "LOCAL_MODE_KEEP_HASH" changelog_body.txt; then
            REAL_ZIP_SHA256=$(sha256sum "$FW_ZIP" | awk '{print $1}')
            sed -i -E "s/SHA256: LOCAL_MODE_KEEP_HASH/SHA256: ${REAL_ZIP_SHA256}/g" changelog_body.txt
          fi

          EXISTING_BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo "")
          if [ -n "$EXISTING_BODY" ] && echo "$EXISTING_BODY" | grep -q "Downloaded file details:"; then
            HEADER_NOTES=$(echo "$EXISTING_BODY" | sed '/Downloaded file details:/,$d')
            echo "$HEADER_NOTES" > release_notes.md
            echo "Downloaded file details:" >> release_notes.md
            echo "" >> release_notes.md
            cat changelog_body.txt >> release_notes.md
          else
            DISPLAY_DATE=$(echo "$FW_DATE_REF" | cut -d' ' -f1)
            if [ -z "$DISPLAY_DATE" ]; then DISPLAY_DATE=$(date +"%Y-%m-%d"); fi
            echo "Official Release Date: $DISPLAY_DATE" > release_notes.md
            echo "" >> release_notes.md
            echo "Automatic download of the official Nintendo Switch firmware version $TAG." >> release_notes.md
            echo "" >> release_notes.md
            echo "Downloaded file details:" >> release_notes.md
            echo "" >> release_notes.md
            cat changelog_body.txt >> release_notes.md
          fi

          gh release edit "$TAG" --title "$FINAL_RELEASE_TITLE" --notes-file release_notes.md || true

          # === GESTION DU NSP (OPTIONNELLE) ===
          GEN_NSP=$(ls Firmware*.nsp 2>/dev/null | grep -v -i "Extracted" | head -n 1)
          if [ -n "$GEN_NSP" ] && [ -f "$GEN_NSP" ]; then
            if [ "$GEN_NSP" != "$CORRECT_NSP_NAME" ]; then mv "$GEN_NSP" "$CORRECT_NSP_NAME"; fi
            if [ "$BUILD_NSP" = "true" ]; then
              echo "⬆️ Uploading NSP asset: $CORRECT_NSP_NAME..."
              gh release upload "$TAG" "$CORRECT_NSP_NAME" --clobber
            fi
          fi

          # === GESTION DES DONNÉES EXTRAITES (ROMFS / EXEFS) ===
          EXTRACT_ZIP_FILE=$(ls Extracted_Firmware*.zip 2>/dev/null | head -n 1)
          if [ -n "$EXTRACT_ZIP_FILE" ] && [ -f "$EXTRACT_ZIP_FILE" ]; then 
            CORRECT_EXTRACT_ZIP="Extracted.Firmware.${TAG}.zip"
            echo "📦 Uploading Extracted ZIP Data: $CORRECT_EXTRACT_ZIP..."
            mv "$EXTRACT_ZIP_FILE" "$CORRECT_EXTRACT_ZIP"
            gh release upload "$TAG" "$CORRECT_EXTRACT_ZIP" --clobber
          fi

          EXTRACT_NSP_FILE=$(ls Extracted_NSP_Firmware*.zip 2>/dev/null | head -n 1)
          if [ -n "$EXTRACT_NSP_FILE" ] && [ -f "$EXTRACT_NSP_FILE" ]; then 
            CORRECT_EXTRACT_NSP="Extracted.NSP.Firmware.${TAG}.zip"
            echo "📦 Uploading Extracted NSP Data..."
            mv "$EXTRACT_NSP_FILE" "$CORRECT_EXTRACT_NSP"
            gh release upload "$TAG" "$CORRECT_EXTRACT_NSP" --clobber
          fi

          # ==========================================================
          # 📄 EXPORT DES MÉTADONNÉES POUR LE DAT CONSOLIDÉ
          # ==========================================================
          if [ "$GENERATE_DATFILE" = "true" ]; then
            cat << 'EOF' > export_version_meta.py
          import sys, os, json, zlib, hashlib
          from firmware_downloader import find_firmware_identity

          tag = sys.argv[1]
          folder_name = sys.argv[2]

          if not os.path.exists(folder_name):
              sys.exit(0)

          nca_files = [os.path.join(folder_name, f) for f in os.listdir(folder_name) if f.endswith(".nca")]
          if not nca_files:
              sys.exit(0)

          roms = []
          for nca in sorted(nca_files, key=os.path.basename):
              md5_h = hashlib.md5()
              sha1_h = hashlib.sha1()
              crc_val = 0
              sz = os.path.getsize(nca)
              with open(nca, "rb") as f:
                  for chunk in iter(lambda: f.read(1048576), b""):
                      md5_h.update(chunk)
                      sha1_h.update(chunk)
                      crc_val = zlib.crc32(chunk, crc_val)
              roms.append({
                  'name': os.path.basename(nca),
                  'size': str(sz),
                  'crc': "%08x" % (crc_val & 0xFFFFFFFF),
                  'md5': md5_h.hexdigest(),
                  'sha1': sha1_h.hexdigest()
              })

          identity_res = find_firmware_identity(folder_name)
          entry_name = identity_res[0] if isinstance(identity_res, tuple) else identity_res
          if not entry_name:
              entry_name = f"Firmware {tag}"

          os.makedirs(".dat_cache", exist_ok=True)
          with open(os.path.join(".dat_cache", f"{tag}.json"), "w", encoding="utf-8") as f:
              json.dump({"tag": tag, "name": entry_name, "roms": roms}, f)

          print(f"[DAT CACHE] Metadata saved for {entry_name}")
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            for attempt in {1..20}; do
              git fetch origin main
              git reset --hard origin/main
              python3 export_version_meta.py "$TAG" "$FOLDER_NAME"
              git add .dat_cache/
              if [ -f "json_updated.flag" ]; then
                git add all_titles.json
              fi
              if git diff --staged --quiet; then
                break
              fi
              git commit -m "Cache DAT metadata for $TAG [skip ci]" || true
              git push origin HEAD:main > /dev/null 2>&1 && break || sleep $((2 + RANDOM % 6))
            done
            rm -f export_version_meta.py
          fi
          
          rm -rf "$FOLDER_NAME" *.zip *.nsp script_output.log release_notes.md changelog_body.txt
          echo "⏳ Terminé pour $TAG."

  consolidate_datfile:
    name: 📄 Consolidate Single Clean DATfile
    needs: [prepare_matrix, verify_and_fix]
    if: always() && !cancelled() && inputs.generate_datfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🧹 Purge multiple DATs and generate SINGLE complete DATfile
        run: |
          cat << 'EOF' > make_final_dat.py
          import os, re, json, time
          import xml.etree.ElementTree as ET

          existing_games = {}

          old_dats = [f for f in os.listdir(".") if f.startswith("Nintendo") and f.endswith(".dat")]
          for od in old_dats:
              try:
                  tree = ET.parse(od)
                  for g in tree.getroot().findall('game'):
                      name = g.get('name')
                      roms = []
                      for r in g.findall('rom'):
                          roms.append({
                              'name': r.get('name'),
                              'size': r.get('size'),
                              'crc': r.get('crc'),
                              'md5': r.get('md5'),
                              'sha1': r.get('sha1')
                          })
                      existing_games[name] = {'name': name, 'roms': roms}
              except Exception:
                  pass

          cache_dir = ".dat_cache"
          if os.path.exists(cache_dir):
              for jf in os.listdir(cache_dir):
                  if jf.endswith(".json"):
                      try:
                          with open(os.path.join(cache_dir, jf), "r", encoding="utf-8") as f:
                              d = json.load(f)
                              name = d["name"]
                              clean_v = d["tag"].replace("-card", "").replace("-pre", "")
                              for k in list(existing_games.keys()):
                                  if f"({clean_v})" in k or f"Firmware {d['tag']}" in k or k == name:
                                      del existing_games[k]
                                      break
                              existing_games[name] = {'name': name, 'roms': d["roms"]}
                      except Exception:
                          pass

          def sort_key(game):
              name = game.get('name', '')
              m = re.search(r'Firmware\s+(\d+(?:\.\d+)+)', name)
              v_parts = [int(p) for p in m.group(1).split('.')] if m else [0, 0, 0]
              while len(v_parts) < 3: v_parts.append(0)
              nl = name.lower()
              if "-pre" in nl or "(pre)" in nl: sub = -2
              elif "card" in nl or "cartridge" in nl: sub = -1
              elif "rebootless" in nl:
                  rm = re.search(r'rebootless(?:\s*update)?\s*(\d+)', nl)
                  sub = int(rm.group(1)) if rm else 1
              else: sub = 0
              raw_match = re.search(r'\((\d+\.\d+\.\d+\.\d{4})\)', name)
              raw_val = raw_match.group(1) if raw_match else ""
              return (*v_parts, sub, raw_val)

          sorted_games = sorted(existing_games.values(), key=sort_key)

          def esc(s):
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;").replace("'", "&apos;")

          t_stamp = time.strftime("%Y%m%d%H%M%S")
          xml = [
              '<?xml version="1.0"?>',
              '<!DOCTYPE datafile PUBLIC "-//Logiqx//DTD ROM Management Datafile//EN" "http://www.logiqx.com/Dats/datafile.dtd">',
              '<datafile>',
              '    <header>',
              '        <name>Nintendo - Nintendo Switch Firmware</name>',
              '        <description>Nintendo - Nintendo Switch Firmware</description>',
              f'        <version>{t_stamp}</version>',
              '        <author>Twitter: @JeremKOYTB</author>',
              '        <comment>DAT generated by firmware_downloader.py. Inspired by the work of 8BitWonder to help him better archive this!</comment>',
              '        <homepage>gbatemp.net</homepage>',
              '        <url>https://gbatemp.net/download/nintendo-switch-firmware-datfile.36558/</url>',
              '    </header>'
          ]
          for g in sorted_games:
              xml.append(f'    <game name="{esc(g["name"])}">')
              xml.append('        <category>Games</category>')
              xml.append(f'        <description>{esc(g["name"])}</description>')
              for r in g['roms']:
                  xml.append(f'        <rom name="{esc(r["name"])}" size="{r["size"]}" crc="{r["crc"]}" md5="{r["md5"]}" sha1="{r["sha1"]}"/>')
              xml.append('    </game>')
          xml.append('</datafile>')

          total_count = len(sorted_games)
          final_dat_name = f"Nintendo - Nintendo Switch Firmware ({total_count}) ({t_stamp}).dat"

          with open(final_dat_name, "w", encoding="utf-8") as f:
              f.write("\n".join(xml) + "\n")

          print(f"[FINAL DAT] Généré avec succès : {final_dat_name} ({total_count} firmwares enregistrés au total).")
          EOF

          python3 make_final_dat.py
          rm -f make_final_dat.py

      - name: 🚀 Commit clean single DATfile to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f Nintendo*.dat 2>/dev/null || true
          git add Nintendo*.dat
          git rm -rf .dat_cache/ 2>/dev/null || true

          git commit -m "Consolidate single clean Nintendo Switch Firmware DATfile [skip ci]" || true

          for attempt in {1..10}; do
            git fetch origin main
            if git push origin HEAD:main; then
              echo "✅ DATfile consolidé et unique poussé sur main avec succès !"
              break
            else
              git rebase origin/main
              sleep 2
            fi
          done
