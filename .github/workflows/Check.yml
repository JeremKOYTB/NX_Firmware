name: 🛠️ Firmware Inspector & Fixer

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Tag à vérifier (ex: 2.0.0-pre, 23.0.0 ou ALL)'
        required: true
        type: string
        default: 'ALL'
      generate_datfile:
        description: '📄 Générer et consolider le DATfile sur main ?'
        required: false
        type: boolean
        default: true
      build_nsp:
        description: 'Reconstruire et uploader le NSP ?'
        required: false
        type: boolean
        default: false
      extract_zip:
        description: 'Extraire les données du système depuis le ZIP (romfs, exefs) ?'
        required: false
        type: boolean
        default: true
      extract_nsp:
        description: 'Extraire les données du système depuis le NSP ?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare_matrix:
    name: 🔍 Scan & Generate Parallel Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 📊 Build JSON Array
        id: set-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ inputs.target_tag }}"
          if [ "$TARGET" = "ALL" ]; then
            echo "INFO: Fetching all existing tags from repository..."
            TAGS=$(gh release list -L 1000 --json tagName --jq '[.[].tagName]')
          else
            echo "INFO: Target is a single tag: $TARGET"
            TAGS=$(jq -n --arg tag "$TARGET" '[$tag]')
          fi
          
          if [ "$(echo "$TAGS" | jq 'length')" -eq 0 ]; then
            echo "ERROR: No tags found to process."
            exit 1
          fi
          
          echo "matrix=$TAGS" >> "$GITHUB_OUTPUT"

  verify_and_fix:
    name: 🛠️ Inspect -> ${{ matrix.tag }}
    needs: prepare_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        tag: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
    steps:
      - name: ⬇️ Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ⚙️ Install required modules
        run: |
          pip install requests cryptography tqdm

      - name: ⬇️ Setup hactool-linux
        run: |
          if [ -f "hactool-linux" ]; then
            cp hactool-linux hactool
            chmod +x hactool
          else
            echo "Error: hactool-linux not found."
            exit 1
          fi

      - name: 🕵️ Execute Local Inspection & Release Title Correction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATE_DATFILE: ${{ inputs.generate_datfile }}
          EXTRACT_ZIP: ${{ inputs.extract_zip }}
          EXTRACT_NSP: ${{ inputs.extract_nsp }}
          BUILD_NSP: ${{ inputs.build_nsp }}
          TAG: ${{ matrix.tag }}
