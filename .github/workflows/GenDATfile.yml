name: 📄 Generate & Sync DATfile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de mise à jour'
        required: true
        default: 'sync_latest'
        type: choice
        options:
          - 'sync_latest'
          - 'sync_releases'
          - 'from_zips'
          - 'fetch_nintendo'

permissions:
  contents: write

jobs:
  build_dat:
    name: 📄 Update DATfile
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: ⬇️ Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ⚙️ Install dependencies
        run: |
          pip install requests cryptography tqdm

      - name: ⬇️ Setup hactool-linux
        run: |
          if [ -f "hactool-linux" ]; then
            cp hactool-linux hactool
            chmod +x hactool
          else
            echo "Error: hactool-linux not found."
            exit 1
          fi

      # Mode 1 (Par défaut) : Synchroniser uniquement la toute dernière release GitHub
      - name: ⚡ Sync ONLY Latest Release to DATfile
        if: ${{ github.event.inputs.mode == 'sync_latest' || github.event.inputs.mode == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 firmware_downloader.py --sync-latest --logs

      # Mode 2 : Synchroniser toutes les releases GitHub manquantes
      - name: 🔄 Sync All Missing DATfile Entries from GitHub Releases
        if: ${{ github.event.inputs.mode == 'sync_releases' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 firmware_downloader.py --sync-releases --logs

      # Mode 3 : Reconstruire entièrement le DAT en téléchargeant tous les ZIPs du dépôt
      - name: 📦 Download all Firmware ZIPs & Build DAT
        if: ${{ github.event.inputs.mode == 'from_zips' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "INFO: Fetching release tags..."
          TAGS=$(gh release list -L 1000 --json tagName --jq '.[].tagName')

          mkdir -p firmware_zips
          cd firmware_zips

          for TAG in $TAGS; do
            echo "⬇️ Checking release $TAG for Firmware archive..."
            gh release download "$TAG" -p "Firmware*.zip" --clobber 2>/dev/null || true
          done

          cd ..
          mv firmware_zips/*.zip . 2>/dev/null || true
          rm -rf firmware_zips

          python3 firmware_downloader.py --dat-from-zips --logs

      # Mode 4 : Télécharger le tout dernier firmware depuis Nintendo et mettre à jour le DAT
      - name: 🌐 Download latest firmware from Nintendo & Update DAT
        if: ${{ github.event.inputs.mode == 'fetch_nintendo' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 firmware_downloader.py --datfile --logs

      - name: 🚀 Commit Updated DATfile to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Trouver le dernier DAT généré
          LATEST_DAT=$(ls -t Nintendo*.dat 2>/dev/null | head -n 1)

          if [ -z "$LATEST_DAT" ]; then
            echo "WARNING: No DATfile found."
            exit 0
          fi

          # Nettoyer les anciens DATs locaux tout en gardant le plus récent
          for f in Nintendo*.dat; do
            if [ "$f" != "$LATEST_DAT" ]; then
              git rm -f "$f" 2>/dev/null || true
            fi
          done

          git add "$LATEST_DAT"
          rm -f *.zip

          if git diff --staged --quiet; then
            echo "INFO: DATfile is already completely up to date. Nothing to commit."
            exit 0
          fi

          git commit -m "Update Nintendo Switch Firmware DATfile [skip ci]"

          for attempt in {1..10}; do
            git fetch origin main
            if git push origin HEAD:main; then
              echo "✅ DATfile successfully committed to main!"
              break
            else
              git rebase origin/main
              sleep 2
            fi
          done
